name: Application CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --cache .cache/npm
      - run: npm run typecheck && npm run lint && npm test && npm run test:setup
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
      - run: npm run test:e2e
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked
        working-directory: backend
      - run: uv run --locked ruff check . && uv run --locked ruff format --check . && uv run --locked mypy && uv run --locked pytest -m "not integration"
        working-directory: backend
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/setup.mjs
      - run: docker compose --profile tools build web api api-test
      - run: docker compose up -d --no-build --wait --wait-timeout 300
      - run: node scripts/smoke.mjs
      - run: docker compose --profile tools run --rm api-test
      - if: always()
        run: docker compose logs --tail=100 && docker compose down --volumes
