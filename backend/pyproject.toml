[project]
name = "smart-construction-api"
version = "0.1.0"
description = "API modular da Smart Construction"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.20.1",
  "boto3==1.43.118",
  "email-validator==2.3.0",
  "fastapi==0.162.0",
  "pillow==13.0.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "python-multipart==0.0.32",
  "sqlalchemy==2.1.6",
  "tzdata==2026.5",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]==1.43.118",
  "httpx2==2.16.0",
  "jsonschema==4.26.0",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.17.2",
]

[tool.uv]
package = false
required-version = "==0.13.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --tb=short"
markers = ["integration: exige PostgreSQL 17 isolado com credencial de migrations"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "migrations", "scripts"]
